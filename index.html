<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="8Count: a free formation planner for dance teams. Stage editor, 8-count timeline, music sync, 3D view and video-to-motion.">
<meta name="theme-color" content="#251b38">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="8Count">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>a{color:#c46a12}body{margin:0;font:14px/1.45 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>8Count</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: app shell — sticky header with tabs; stage + inspector side by side, 8-count timeline strip below; stacks on phones. The dark stage floor is the one bold surface. */
:root{
  --bg:#f3f1f8; --surface:#ffffff; --surface-2:#ebe7f3; --ink:#1d1630; --muted:#6a6280; --line:#ddd7ea;
  --accent:#d9781a; --accent-soft:#fbe7cf; --accent-ink:#ffffff;
  --stage:#251b38; --stage-2:#2e2345; --stage-line:rgba(255,255,255,.07); --stage-line-2:rgba(255,255,255,.16); --stage-ink:#e9e2f6; --stage-mark:#f2b544;
  --good:#1f8f5f; --warn:#b7791f; --bad:#c43d4b;
  --f-display:"Yatra One", "Manrope", system-ui, sans-serif;
  --f-body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#110d1b; --surface:#1a1427; --surface-2:#231b34; --ink:#eee9f7; --muted:#a49bba; --line:#2d2442;
  --accent:#f2a33a; --accent-soft:#3a2a18; --accent-ink:#1a1206;
  --stage:#1d1530; --stage-2:#251c3b; --stage-line:rgba(255,255,255,.06); --stage-line-2:rgba(255,255,255,.14); --stage-ink:#e9e2f6; --stage-mark:#f2b544;
  --good:#4cc38a; --warn:#e0a84a; --bad:#ef6b78; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#110d1b; --surface:#1a1427; --surface-2:#231b34; --ink:#eee9f7; --muted:#a49bba; --line:#2d2442;
  --accent:#f2a33a; --accent-soft:#3a2a18; --accent-ink:#1a1206;
  --stage:#1d1530; --stage-2:#251c3b; --stage-line:rgba(255,255,255,.06); --stage-line-2:rgba(255,255,255,.14); --stage-ink:#e9e2f6; --stage-mark:#f2b544;
  --good:#4cc38a; --warn:#e0a84a; --bad:#ef6b78; color-scheme:dark }

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.hrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:26px;line-height:1;letter-spacing:.5px;display:flex;align-items:baseline;gap:2px}
.brand b{color:var(--accent);font-weight:400}
.teamname{color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.tabs{display:flex;gap:2px;background:var(--surface-2);padding:3px;border-radius:999px}
.tabs button{border:0;background:none;padding:6px 14px;border-radius:999px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.pill.ok i{background:var(--good)} .pill.warn i{background:var(--warn)} .pill.busy i{background:var(--accent)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 11px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 8px;min-width:0}
textarea{resize:vertical;width:100%}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px;max-width:1400px;margin:0 auto}

/* routine bar */
.rbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.rbar select{font-weight:700;font-size:15px;max-width:260px}
.ro .w{display:none!important}

/* stage area */
.studio{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
@media (max-width:980px){.studio{grid-template-columns:minmax(0,1fr)}}
.stagecard{background:var(--stage);border-radius:14px;padding:10px;position:relative;min-width:0}
.stagetop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:2px 4px 8px;color:var(--stage-ink)}
.stagetop .seg{border-color:var(--stage-line-2)}
.stagetop .seg button{background:transparent;color:rgba(233,226,246,.7)}
.stagetop .seg button+button{border-left-color:var(--stage-line-2)}
.stagetop .seg button[aria-pressed="true"]{background:var(--stage-mark);color:#22180a}
.fname{font-family:var(--f-display);font-size:20px;line-height:1.1;color:var(--stage-ink)}
.fcount{font-family:var(--f-mono);font-size:12px;color:var(--stage-mark)}
#stageSvg{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none}
#stage3d{display:block;width:100%;height:auto;border-radius:8px}
.floor{fill:var(--stage-2)}
.gl{stroke:var(--stage-line);stroke-width:.05}
.gl2{stroke:var(--stage-line-2);stroke-width:.07}
.cl{stroke:var(--stage-mark);stroke-width:.06;stroke-dasharray:.3 .3;opacity:.55}
.num{fill:var(--stage-mark);font-family:var(--f-mono);font-size:.62px;text-anchor:middle;font-weight:700}
.side{fill:rgba(233,226,246,.45);font-family:var(--f-body);font-size:.55px;font-weight:700;letter-spacing:.12px;text-anchor:middle}
.tok{cursor:grab}
.tok circle.b{stroke:rgba(0,0,0,.35);stroke-width:.06}
.tok text.i{fill:#fff;font-family:var(--f-body);font-weight:800;font-size:.62px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.tok text.mv{fill:var(--stage-mark);font-family:var(--f-body);font-weight:700;font-size:.46px;text-anchor:middle;pointer-events:none}
.tok text.nm{fill:var(--stage-ink);font-family:var(--f-body);font-weight:600;font-size:.46px;text-anchor:middle;pointer-events:none;opacity:.85}
.tok .ring{fill:none;stroke:var(--stage-mark);stroke-width:.14;display:none}
.tok.sel .ring{display:block}
.tok.dim{opacity:.28}
.tok.me .ring{display:block;stroke:#fff;stroke-width:.18}
.ghost{fill:none;stroke-width:.06;stroke-dasharray:.18 .14;opacity:.6}
.path{fill:none;stroke-width:.08;stroke-dasharray:.25 .2;opacity:.75}
.marq{fill:rgba(242,181,68,.12);stroke:var(--stage-mark);stroke-width:.05}
.ro .tok,.spot .tok{cursor:default}

/* transport */
.transport{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 4px 2px;color:var(--stage-ink)}
.transport .btn{background:transparent;border-color:var(--stage-line-2);color:var(--stage-ink)}
.transport .btn.pri{background:var(--stage-mark);border-color:var(--stage-mark);color:#22180a}
.counter{display:flex;align-items:baseline;gap:10px;font-family:var(--f-mono)}
.counter .big{font-size:22px;font-weight:700;color:var(--stage-mark)}
.counter .sm{font-size:12px;color:rgba(233,226,246,.65)}
.dots{display:flex;gap:4px}
.dots span{width:9px;height:9px;border-radius:50%;background:var(--stage-line-2)}
.dots span.on{background:var(--stage-mark)}

/* timeline */
.timeline{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px 12px}
.tlhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.tlscroll{overflow-x:auto;position:relative;padding-bottom:4px}
.tlinner{position:relative;min-width:100%}
.ruler{height:20px;position:relative;cursor:pointer;border-bottom:1px solid var(--line)}
.ruler span{position:absolute;top:2px;font-family:var(--f-mono);font-size:10px;color:var(--muted);padding-left:3px;border-left:1px solid var(--line);height:16px}
.blocks{height:58px;margin-top:6px;position:relative}
.blk{position:absolute;top:0;bottom:0;display:flex;border-radius:7px;overflow:hidden;cursor:pointer;min-width:0}
.blk .h{flex:none;background:var(--surface-2);padding:5px 7px;display:flex;flex-direction:column;justify-content:space-between;min-width:0;overflow:hidden}
.blk .t{flex:1;min-width:0;background:repeating-linear-gradient(135deg,var(--surface-2) 0 5px,transparent 5px 10px);border-left:1px dashed var(--line)}
.blk .h b{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .h small{font-family:var(--f-mono);font-size:10px;color:var(--muted);white-space:nowrap}
.blk.cur{outline:2px solid var(--accent);outline-offset:-2px}
.blk.cur .h{background:var(--accent-soft)}
.blk .nt{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:4px;vertical-align:middle}
.playhead{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);pointer-events:none}
.addblk{position:absolute;top:0;bottom:0;width:58px;border:1.5px dashed var(--line);border-radius:7px;background:none;color:var(--muted);font-size:20px}

/* inspector */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:14px;min-width:0}
.sec{display:flex;flex-direction:column;gap:8px}
.sec+.sec{border-top:1px solid var(--line);padding-top:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600}
.chip:hover{border-color:var(--accent)}
.sw{width:14px;height:14px;border-radius:50%;display:inline-block;flex:none}
.hint{font-size:12px;color:var(--muted)}
.tcat{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding:6px 0 4px;margin-top:4px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tcard{display:flex;flex-direction:column;gap:6px;padding:6px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);text-align:center;min-width:0}
.tcard:hover{border-color:var(--accent)}
.tcard svg{width:100%;height:auto;display:block}
.tcard .tfl{fill:var(--stage);stroke:var(--stage-line-2);stroke-width:.15}
.tcard .tdot{fill:var(--stage-mark)}
.tcard span{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;padding:0;text-decoration:underline}
body.phone header{display:none}
body.phone .tok:not(.me) text.nm,body.phone .tok:not(.me) text.mv{display:none}
body.phone .tok.me text.nm,body.phone .tok.me text.mv{font-size:.7px}
body.phone main{max-width:none;padding-block:16px}
.p-wrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.p-dev{width:min(100%,402px);height:min(844px,calc(100dvh - 70px));min-height:560px;border-radius:54px;padding:11px;background:#0a0710;box-shadow:0 0 0 2px #2b2338,0 24px 60px rgba(20,10,40,.35)}
.p-screen{height:100%;border-radius:44px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;position:relative}
.p-island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:112px;height:32px;border-radius:20px;background:#000;z-index:2}
.p-top{display:flex;align-items:baseline;gap:8px;padding:54px 18px 8px;min-width:0}
.p-top .brand{font-size:22px}
.p-sub{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-body{flex:1;overflow-y:auto;padding:4px 14px 16px;display:flex;flex-direction:column;gap:12px;min-height:0}
.p-tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--surface);padding:7px 0 24px}
.p-tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:700;color:var(--muted)}
.p-tabs button[aria-selected="true"]{color:var(--accent)}
.p-tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.p-stage{background:var(--stage);border-radius:18px;padding:12px 10px 10px;display:flex;flex-direction:column;gap:6px}
.p-stage .fname{font-size:19px}
.p-btns{display:flex;justify-content:center;gap:14px;align-items:center}
.p-btns button{width:46px;height:46px;border-radius:50%;border:1px solid var(--stage-line-2);background:transparent;color:var(--stage-ink);font-size:15px}
.p-btns button.pri{width:62px;height:62px;background:var(--stage-mark);border-color:var(--stage-mark);color:#22180a;font-size:20px}
.p-ctl{display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:4px}
.p-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.p-card b{font-size:15px}
.p-card select{width:100%;margin-top:4px}
.p-empty{text-align:center;color:var(--muted);padding:40px 12px}
.p-note{font-size:12px;color:var(--muted);text-align:center}
.p-body .sess{grid-template-columns:58px minmax(0,1fr);padding:10px 12px}
.p-body .date b{font-size:18px}
@media (max-width:520px){
  .p-dev{width:100%;height:calc(100dvh - 36px);min-height:0;padding:0;border-radius:0;background:none;box-shadow:none}
  .p-screen{border-radius:16px}.p-island{display:none}.p-top{padding-top:12px}.p-tabs{padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
  body.phone main{padding-block:8px}}
.studio-box{max-width:1080px!important;max-height:calc(100dvh - 32px);overflow-y:auto}
.ms-title{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.1;margin:0}
.ms-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:860px){.ms-grid{grid-template-columns:minmax(0,1fr)}}
.ms-step{display:flex;flex-direction:column;gap:10px;min-width:0}
.ms-h{display:flex;gap:10px;align-items:flex-start}
.ms-h b{display:block;font-size:15px}
.ms-h small{color:var(--muted);font-size:12px}
.ms-n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.ms-pane{aspect-ratio:4/5;max-height:46vh;width:100%;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;overflow:hidden;text-align:center;padding:10px}
.ms-pane video{max-width:100%;max-height:100%;border-radius:8px;background:#000}
.ms-pane.dark{background:var(--stage);border-color:transparent;padding:0}
.ms-pane canvas{width:100%;height:100%;display:block}
.ms-prog{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.ms-prog div{height:100%;width:0;background:var(--accent);transition:width .15s}
.ms-trim{display:grid;grid-template-columns:auto 1fr auto;gap:6px 8px;align-items:center;font-size:12px}
.ms-trim input[type=range]{width:100%;accent-color:var(--accent)}
.ms-who{display:flex;flex-direction:column;gap:4px;max-height:180px;overflow-y:auto;border:1px solid var(--line);border-radius:9px;padding:6px 8px}
.ms-who label{display:flex;align-items:center;gap:8px;font-size:13px}
.clip{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.clip:last-child{border-bottom:0}
.clip b{flex:1;min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seltools{position:absolute;z-index:3;transform:translateX(-50%);display:flex;gap:6px;white-space:nowrap}
.seltools .btn{background:rgba(10,6,20,.88);color:var(--stage-ink);border-color:var(--stage-mark);box-shadow:0 4px 14px rgba(0,0,0,.4);padding:5px 11px}
.seltools .btn.go{background:var(--stage-mark);color:#22180a}
.seltools .btn:hover{border-color:#fff}
.pilltog{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--stage-line-2);background:transparent;color:rgba(233,226,246,.75);border-radius:999px;padding:5px 12px 5px 6px;font-weight:700;font-size:13px}
.pilltog .trk{width:28px;height:16px;border-radius:9px;background:var(--stage-line-2);position:relative;flex:none}
.pilltog .trk::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#e9e2f6;transition:left .15s}
.pilltog[aria-pressed="true"]{border-color:var(--stage-mark);color:var(--stage-ink)}
.pilltog[aria-pressed="true"] .trk{background:var(--stage-mark)}
.pilltog[aria-pressed="true"] .trk::after{left:14px;background:#22180a}
.swapbar{position:absolute;z-index:3;left:50%;top:64px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:rgba(10,6,20,.88);color:var(--stage-ink);border:1px solid var(--stage-mark);border-radius:999px;padding:6px 8px 6px 14px;font-size:13px;font-weight:600;white-space:nowrap;max-width:calc(100% - 24px)}
.swapbar span{overflow:hidden;text-overflow:ellipsis}
.swapbar .btn{background:transparent;color:var(--stage-ink);border-color:var(--stage-line-2)}
.tok:focus,.tok:focus-visible{outline:none}
.gh-dot{fill-opacity:.42;stroke:#fff;stroke-width:.08;stroke-dasharray:.22 .14}
.gh-txt{fill:#fff;fill-opacity:.85;font-family:var(--f-body);font-weight:800;font-size:.62px;text-anchor:middle;dominant-baseline:central}
.gh-line{stroke-width:.06;stroke-dasharray:.2 .18;opacity:.7}
.gh-lbl{fill:var(--stage-mark);font-family:var(--f-body);font-weight:700;font-size:.6px;text-anchor:middle;paint-order:stroke;stroke:var(--stage);stroke-width:.28px;stroke-linejoin:round}
.dragging .tok{opacity:.9}
.tok.swapsrc .ring{display:block;stroke-dasharray:.35 .22}
.swapping .tok{cursor:pointer}
.cue{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:10px;border:1px solid var(--line);border-radius:9px;cursor:pointer}
.cue.cur{border-color:var(--accent);background:var(--accent-soft)}
.cue .n{font-family:var(--f-mono);font-size:11px;color:var(--muted);grid-row:span 3}
.cue b{font-size:13px}
.cue .p{font-size:12px}
.cue .m{font-size:12px;color:var(--muted)}

/* lists (team, rehearsals, wardrobe) */
.pagehead{display:flex;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.pagehead h1{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.1;margin:0;text-wrap:balance}
.pagehead p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td input[type=text]{width:100%;min-width:90px}
td input.ht{width:64px}
td select{max-width:140px}
.status{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.st-needed{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.st-ordered{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.st-ready{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.sess{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.sess:last-child{border-bottom:0}
.sess.past{opacity:.55}
.date{display:flex;flex-direction:column;align-items:center;border:1px solid var(--line);border-radius:9px;padding:6px 0;background:var(--surface-2)}
.date b{font-family:var(--f-display);font-size:22px;font-weight:400;line-height:1}
.date small{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.statrow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12px;color:var(--muted)}
.stat b{display:block;font-family:var(--f-mono);font-size:18px;color:var(--ink)}

/* welcome */
.welcome{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px}
@media (max-width:820px){.welcome{grid-template-columns:minmax(0,1fr)}}
.welcome h1{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,4vw,40px);line-height:1.08;margin:0 0 10px;text-wrap:balance}
.welcome p{color:var(--muted);margin:0 0 16px;max-width:52ch}
.welcome ul{margin:0 0 18px;padding-left:18px;color:var(--muted)}
.welcome li{margin:3px 0}

.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:999px;font-weight:600;font-size:13px;z-index:20;max-width:calc(100vw - 32px)}
.modal{position:fixed;inset:0;background:rgba(10,6,20,.5);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}
.modal .box{background:var(--surface);border-radius:14px;padding:18px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px}
.kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px}
@media (max-width:600px){ .brand{font-size:22px} .tabs button{padding:6px 10px} .counter .big{font-size:18px} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>

<header>
  <div class="hrow">
    <div class="brand" aria-label="8Count"><b>8</b>Count</div>
    <span class="teamname" id="teamLabel"></span>
    <div class="spacer"></div>
    <span class="pill" id="syncPill"><i></i><span>Loading…</span></span>
  </div>
  <div class="hrow" style="margin-top:8px">
    <nav class="tabs" role="tablist" id="tabs">
      <button role="tab" data-tab="stage" aria-selected="true">Stage</button>
      <button role="tab" data-tab="team">Team</button>
      <button role="tab" data-tab="rehearsals">Rehearsals</button>
      <button role="tab" data-tab="wardrobe">Costumes &amp; props</button>
    </nav>
  </div>
</header>

<main id="main"></main>
<audio id="au" preload="auto"></audio>
<input type="file" id="songFile" accept="audio/*,video/mp4" hidden>

<script>
(()=>{
"use strict";
/* ---------------- constants ---------------- */
const PALETTE=["#e0457b","#19a974","#2f7de1","#f29a1f","#9b5de5","#00a9b5","#e8603c","#c9a227","#5c6bc0","#d6409f","#43a047","#a1887f","#ef5350","#26c6da","#7e57c2","#8bc34a"];
const MOVES=["Thumka","Chakkar spin","Jhatka","Bhangra shoulders","Lehra arms","Mudra pose","Floor drop","Lift","Ripple","Canon","Clap","Freeze"];
const TEMPLATE_GROUPS=[
  ["For {n} dancers",[["honeycomb","Honeycomb field"],["windows","Windows"],["clusters","Trios"],["files2","Two files"]]],
  ["Lines & files",[["line","Horizontal line"],["file","Vertical file"],["diag","Diagonal, rising left"],["diag2","Diagonal, rising right"]]],
  ["Arcs & curves",[["arcFront","Arc toward audience"],["arcBack","Arc away"],["circle","Circle"],["arc","Arc + soloist"]]],
  ["Shapes",[["v","V to audience"],["invv","Inverted V"],["pyramid","Pyramid"],["diamond","Diamond"]]],
  ["Blocks & groups",[["block","Block"],["split","Split groups"]]]];
const ROLES=["Dancer","Captain","Choreographer","Co-captain"];
const SKILLS=["Beginner","Intermediate","Advanced"];
const STATUSES=[["needed","Needed"],["ordered","Ordered"],["ready","Ready"]];
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-3);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ls={get(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const initials=n=>{const p=String(n||"?").trim().split(/\s+/);return ((p[0]||"?")[0]+(p[1]?p[1][0]:(p[0]||"")[1]||"")).toUpperCase()};
const shortName=n=>{n=String(n||"");return n.length<=10?n:n.split(/\s+/)[0]};
const fmtHt=inch=>{inch=Math.round(inch||0);return inch?`${Math.floor(inch/12)}'${inch%12}"`:""};
const parseHt=s=>{s=String(s).trim();let m=s.match(/^(\d)\s*['’ ]\s*(\d{1,2})?/);if(m)return (+m[1])*12+(+(m[2]||0));m=s.match(/^(\d{2,3})$/);if(m)return +m[1];return 0};

/* ---------------- state ---------------- */
let team={name:"",roster:[],sessions:[],items:[]};
let routines={};
let motions={};
const ui={swapFrom:null,swapMode:false,collect:false,phone:false,ptab:"spot",tab:"stage",rid:ls.get("8c.rid"),f:0,beat:0,sel:new Set(),mode:"edit",view:"top",showPaths:true,snap:true,playing:false,spot:ls.get("8c.spot"),shortFront:true};
let canWrite=true, backend="loading", db=null, sampler=null;
const dirty={}, timers={}, inflight={}, again={};
const undoStack=[];

/* cache for instant first paint + offline */
const cache=ls.get("8c.cache");
if(cache&&cache.team){team=cache.team;routines=cache.routines||{};motions=cache.motions||{}}
function persistLocal(){ls.set("8c.cache",{team,routines,motions})}

/* ---------------- helpers on routines ---------------- */
const R=()=>routines[ui.rid]||null;
const sortedRoutines=()=>Object.values(routines).sort((a,b)=>(a.created||0)-(b.created||0));
const dancer=id=>team.roster.find(d=>d.id===id);
const castOf=r=>r.cast.map(dancer).filter(Boolean);
function starts(r){const s=[];let b=0;r.formations.forEach((f,i)=>{s.push(b);b+=f.hold+(i<r.formations.length-1?f.trans:0)});return s}
function totalBeats(r){const s=starts(r);const l=r.formations.length-1;return l<0?0:s[l]+r.formations[l].hold}
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function locate(r,beat){const s=starts(r);let i=r.formations.length-1;for(let k=0;k<s.length;k++){if(beat<s[k]+r.formations[k].hold+(k<s.length-1?r.formations[k].trans:0)){i=k;break}}
  const into=beat-s[i],f=r.formations[i];if(into<f.hold||i===r.formations.length-1)return{i,t:0,moving:false};return{i,t:clamp((into-f.hold)/Math.max(f.trans,.0001),0,1),moving:true}}
function defaultSpot(r,id){const k=r.cast.indexOf(id);const n=Math.max(r.cast.length,1);const sp=Math.min(3,(r.W-4)/Math.max(n-1,1));return{x:+((k-(n-1)/2)*sp).toFixed(1),y:+(r.D*0.4).toFixed(1)}}
function posIn(r,f,id){return f.pos[id]||defaultSpot(r,id)}
function posAt(r,beat,id){const L=locate(r,beat);const a=posIn(r,r.formations[L.i],id);if(!L.moving)return a;const b=posIn(r,r.formations[L.i+1],id);const e=ease(L.t);return{x:a.x+(b.x-a.x)*e,y:a.y+(b.y-a.y)*e}}
function beatToSec(r,b){return r.offset+b*60/r.bpm}
function secToBeat(r,s){return (s-r.offset)*r.bpm/60}
const fmtTime=s=>{s=Math.max(0,s);return `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`};
const eightLabel=b=>{b=Math.max(0,b);return{eight:Math.floor(b/8)+1,count:Math.floor(b%8)+1}};
function describePos(r,p){const x=Math.abs(p.x)<.25?"center":`${Math.abs(p.x).toFixed(1).replace(/\.0$/,"")} ft stage ${p.x>0?"left":"right"}`;
  return `${x}, ${p.y.toFixed(1).replace(/\.0$/,"")} ft from the front`}

/* ---------------- templates ---------------- */
function template(kind,n,W,D){const P=[];if(!n)return P;const cx=0,mid=D*0.45,sp=n>1?Math.min(3,(W-4)/(n-1)):0;
  const line=(m,y,s,off=0)=>{for(let k=0;k<m;k++)P.push({x:(k-(m-1)/2)*s+off,y})};
  switch(kind){
    case"line":line(n,mid,sp);break;
    case"windows":{const a=Math.ceil(n/2),b=n-a,s=Math.min(4,(W-4)/Math.max(a,1));line(a,D*0.32,s);line(b,D*0.32+4,s,b===a?s/2:0);break}
    case"v":case"invv":{const s=Math.min(2.6,(W-4)/Math.max(n,2));for(let k=0;k<n;k++){const side=k===0?0:(k%2?-1:1),step=Math.ceil(k/2);const y=kind==="v"?D*0.25+step*1.7:D*0.75-step*1.7;P.push({x:side*step*s,y})}break}
    case"diag":for(let k=0;k<n;k++){const t=n>1?k/(n-1):.5;P.push({x:-W*0.35+t*W*0.7,y:D*0.2+t*D*0.6})}break;
    case"circle":{const rr=Math.min(W,D)*0.3;for(let k=0;k<n;k++){const a=Math.PI/2+k*2*Math.PI/n;P.push({x:cx+rr*Math.cos(a),y:D*0.5+rr*Math.sin(a)})}break}
    case"block":{const c=Math.ceil(Math.sqrt(n*1.4)),rows=Math.ceil(n/c);let k=0;for(let r=0;r<rows;r++){const m=Math.min(c,n-k);line(m,D*0.28+r*3.2,3.2);k+=m}break}
    case"pyramid":{let k=0,r=1;while(k<n){const m=Math.min(r,n-k);line(m,D*0.22+(r-1)*2.8,3.4);k+=m;r++}break}
    case"split":{const a=Math.ceil(n/2),b=n-a;const blk=(m,ox)=>{const c=Math.ceil(Math.sqrt(m));for(let k=0;k<m;k++)P.push({x:ox+((k%c)-(c-1)/2)*2.6,y:D*0.35+Math.floor(k/c)*2.6})};blk(a,-W*0.27);blk(b,W*0.27);break}
    case"file":{const s=n>1?Math.min(2.6,(D-4)/(n-1)):0;for(let k=0;k<n;k++)P.push({x:0,y:D*0.5+(k-(n-1)/2)*s});break}
    case"files2":{const a=Math.ceil(n/2),b=n-a;const col=(m,x)=>{const s=m>1?Math.min(2.6,(D-4)/(m-1)):0;for(let k=0;k<m;k++)P.push({x,y:D*0.5+(k-(m-1)/2)*s})};col(a,-W*0.18);col(b,W*0.18);break}
    case"diag2":for(let k=0;k<n;k++){const t=n>1?k/(n-1):.5;P.push({x:W*0.35-t*W*0.7,y:D*0.2+t*D*0.6})}break;
    case"honeycomb":{const s=n>1?Math.min(2.6,(W-4)/(n-1)):0;for(let k=0;k<n;k++)P.push({x:(k-(n-1)/2)*s,y:mid+(k%2?-1.2:1.2)});break}
    case"clusters":{const g=Math.ceil(n/3);const gs=g>1?Math.min(9,(W-6)/(g-1)):0;const tri=[[0,1.2],[-1.3,-1],[1.3,-1]];for(let k=0;k<n;k++){const gi=Math.floor(k/3),o=tri[k%3];P.push({x:(gi-(g-1)/2)*gs+o[0],y:mid+o[1]+(gi%2?2:0)})}break}
    case"arcFront":case"arcBack":{const s=n>1?Math.min(3,(W-4)/(n-1)):0;const half=((n-1)/2)*s||1;for(let k=0;k<n;k++){const x=(k-(n-1)/2)*s;const c=(x/half)*(x/half)*D*0.25;P.push({x,y:kind==="arcFront"?D*0.25+c:D*0.6-c})}break}
    case"diamond":{const rx=Math.min(W*0.3,1.6*n),ry=Math.min(D*0.3,1.1*n);for(let k=0;k<n;k++){const t=k/n*4;const seg=Math.floor(t),u=t-seg;const pts=[[0,-ry],[rx,0],[0,ry],[-rx,0],[0,-ry]];const a=pts[seg],b=pts[seg+1];P.push({x:a[0]+(b[0]-a[0])*u,y:D*0.5+a[1]+(b[1]-a[1])*u})}break}
    case"arc":{P.push({x:0,y:D*0.2});const m=n-1,rr=Math.min(W*0.38,D*0.5);for(let k=0;k<m;k++){const a=Math.PI*(0.15+0.7*(m>1?k/(m-1):.5));P.push({x:-rr*Math.cos(a),y:D*0.25+rr*Math.sin(a)*0.9})}break}
  }
  return P.map(p=>({x:+clamp(p.x,-W/2+1,W/2-1).toFixed(1),y:+clamp(p.y,1,D-1).toFixed(1)}))}
function assign(r,points,ids){/* shortest to front-most spots when chosen */
  let ds=ids.map(dancer).filter(Boolean);let pts=points.slice();
  if(ui.shortFront){ds.sort((a,b)=>(a.height||66)-(b.height||66));pts.sort((a,b)=>a.y-b.y||Math.abs(a.x)-Math.abs(b.x))}
  const out={};ds.forEach((d,k)=>{if(pts[k])out[d.id]=pts[k]});return out}

/* ---------------- persistence ---------------- */
function setStatus(kind,text){const p=$("#syncPill");p.className="pill "+kind;p.lastChild.textContent=text}
function pushUndo(){const r=R();if(!r)return;undoStack.push({rid:r.id,data:clone(r)});if(undoStack.length>60)undoStack.shift()}
function undo(){const u=undoStack.pop();if(!u)return toast("Nothing to undo");routines[u.rid]=u.data;ui.rid=u.rid;ui.f=Math.min(ui.f,u.data.formations.length-1);saveRoutine(u.data,true);render();toast("Undone")}
function saveRoutine(r,skipStamp){if(!canWrite)return;if(!skipStamp)r.updatedAt=Date.now();persistLocal();queue("r:"+r.id)}
function saveTeam(){if(!canWrite)return;team.updatedAt=Date.now();persistLocal();queue("team")}
function queue(key){if(backend!=="cloud"){setStatus("ok","Saved in this browser");return}dirty[key]=true;setStatus("busy","Saving…");clearTimeout(timers[key]);timers[key]=setTimeout(()=>{delete timers[key];flush(key)},450)}
async function flush(key){if(inflight[key]){again[key]=true;return}inflight[key]=true;
  try{if(key==="team"){await db.doc("team/main").set(clone(team))}
      else{const id=key.slice(2);const r=routines[id];if(r)await db.doc("routines/"+id).set(clone(r));else await db.doc("routines/"+id).delete()}
      setStatus("ok","Synced with team")}
  catch(e){const c=e&&e.code;
    if(c==="invalid_argument"){canWrite=false;applyRO();setStatus("warn","View only");toast("You can view this routine but not edit it")}
    else if(c==="quota_exceeded"){setStatus("warn","Storage full");toast("Team storage is full. Delete an old routine to keep saving.")}
    else{setStatus("warn","Not synced – retrying");setTimeout(()=>{dirty[key]=true;flush(key)},2500+Math.random()*1500)}}
  finally{inflight[key]=false;if(again[key]){again[key]=false;flush(key)}else{dirty[key]=!!timers[key]}}}

/* song files stay on each device (IndexedDB) */
const idb={_db:null,async open(){if(this._db)return this._db;return this._db=await new Promise((res,rej)=>{try{const q=indexedDB.open("8count",1);q.onupgradeneeded=()=>q.result.createObjectStore("songs");q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}catch(e){rej(e)}})},
  async put(k,v){try{const d=await this.open();await new Promise((res,rej)=>{const t=d.transaction("songs","readwrite");t.objectStore("songs").put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}catch(e){}},
  async get(k){try{const d=await this.open();return await new Promise((res,rej)=>{const q=d.transaction("songs").objectStore("songs").get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}catch(e){return null}}};
let songFor=null, songUrl=null;
async function loadSongFor(r){const au=$("#au");if(!r){return}if(songFor===r.id)return;songFor=r.id;if(songUrl){URL.revokeObjectURL(songUrl);songUrl=null}au.removeAttribute("src");au.load();
  const blob=await idb.get(r.id);if(blob&&songFor===r.id){songUrl=URL.createObjectURL(blob);au.src=songUrl}if(ui.tab==="stage")renderTransport()}
const hasSong=()=>!!$("#au").getAttribute("src");

/* ---------------- toast / modal ---------------- */
let tt;function toast(msg){let el=$(".toast");if(!el){el=document.createElement("div");el.className="toast";el.setAttribute("role","status");document.body.appendChild(el)}el.textContent=msg;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,2600)}
function confirmBox(title,body,okText,onOk){const m=document.createElement("div");m.className="modal";m.innerHTML=`<div class="box" role="dialog" aria-modal="true"><b style="font-size:16px">${esc(title)}</b><div class="hint" style="font-size:13px">${esc(body)}</div><div class="row" style="justify-content:flex-end"><button class="btn" data-x>Cancel</button><button class="btn pri" data-ok>${esc(okText)}</button></div></div>`;
  document.body.appendChild(m);m.addEventListener("click",e=>{if(e.target===m||e.target.closest("[data-x]"))m.remove();if(e.target.closest("[data-ok]")){m.remove();onOk()}});$("[data-ok]",m).focus()}
function promptBox(title,value,okText,onOk){const m=document.createElement("div");m.className="modal";m.innerHTML=`<form class="box"><b style="font-size:16px">${esc(title)}</b><input type="text" id="pbIn" value="${esc(value)}"><div class="row" style="justify-content:flex-end"><button type="button" class="btn" data-x>Cancel</button><button class="btn pri">${esc(okText)}</button></div></form>`;
  document.body.appendChild(m);const inp=$("#pbIn",m);inp.focus();inp.select();m.addEventListener("click",e=>{if(e.target===m||e.target.closest("[data-x]"))m.remove()});$("form",m).addEventListener("submit",e=>{e.preventDefault();const v=inp.value.trim();m.remove();if(v)onOk(v)})}

/* ---------------- render: shell ---------------- */
function applyRO(){document.body.classList.toggle("ro",!canWrite);if(!canWrite&&ui.mode==="edit"){ui.mode="spot"}}
function render(){
  document.body.classList.toggle("phone",ui.phone);
  if(ui.phone){renderPhone();return}
  $("#teamLabel").textContent=team.name||"";
  $$("#tabs button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===ui.tab)));
  document.body.classList.toggle("spot",ui.mode==="spot");
  const m=$("#main");
  if(ui.tab==="stage")renderStageTab(m);else if(ui.tab==="team")renderTeam(m);else if(ui.tab==="rehearsals")renderSessions(m);else renderWardrobe(m);
}
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;stop();ui.tab=b.dataset.tab;render();window.scrollTo(0,0)});

/* ---------------- STAGE TAB ---------------- */
function renderStageTab(m){
  const list=sortedRoutines();
  if(!list.length){m.innerHTML=welcomeHTML();bindWelcome(m);return}
  if(!routines[ui.rid])ui.rid=list[0].id;const r=R();ls.set("8c.rid",r.id);
  ui.f=clamp(ui.f,0,r.formations.length-1);
  loadSongFor(r);
  const cast=castOf(r);
  m.innerHTML=`

/* ---------------- motion capture: shared helpers ---------------- */
const MP_J=[0,11,12,13,14,15,16,23,24,25,26,27,28,31,32]; /* nose, shoulders, elbows, wrists, hips, knees, ankles, toes */
const FIG_SEGS=[[1,3,.12],[3,5,.1],[2,4,.12],[4,6,.1],[7,9,.17],[9,11,.14],[11,13,.09],[8,10,.17],[10,12,.14],[12,14,.09]];
function makeProj(w,h,W,D){const cy=D*0.75,hz=h*0.12;const f=0.94*w*cy/W;const ch=(0.9*h-hz)*cy/f;return(x,y,z)=>{const d=Math.max(.5,y+cy);return[w/2+f*x/d,hz+f*(ch-z)/d,f/d]}}
function clipFrame(cl,t){const n=cl.n;const fi=clamp(t*cl.fps,0,n-1);const i=Math.floor(fi),u=fi-i,j=Math.min(i+1,n-1);const D=cl.data,out=[];
  for(let k=0;k<15;k++){const a=(i*15+k)*3,b=(j*15+k)*3;out.push([(D[a]+(D[b]-D[a])*u)/1000,(D[a+1]+(D[b+1]-D[a+1])*u)/1000,(D[a+2]+(D[b+2]-D[a+2])*u)/1000])}return out}
/* a clip plays from count 1 of the formation it's placed on until it ends, carrying into later formations;
   a later formation that sets its own clip, or "Stop motion here" (null), takes over */
function motionAt(r,L,beat,id){const s=starts(r);for(let j=L.i;j>=0;j--){const mo=r.formations[j].motion;if(!mo||!(id in mo))continue;
  const cid=mo[id];const cl=cid&&motions[cid];if(!cl||!cl.data)return null;const t=Math.max(0,(beat-s[j])*60/r.bpm);
  if(j<L.i&&t>cl.dur)return null;return{joints:clipFrame(cl,t),ref:cl.ref||1.5}}return null}
/* draws a capsule-limbed body; joints are [x right, h up, d upstage] in meters, k converts to stage feet */
function drawFigure(c,pr,p,J,k,color){const Wp=J.map(([x,h,d])=>({X:p.x+x*k,Y:p.y+d*k,Z:h*k}));const P=Wp.map(q=>pr(q.X,q.Y,q.Z));const edge="rgba(12,7,24,.6)";
  const path=pts=>{c.beginPath();pts.forEach((q,n)=>n?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1]))};
  const limb=(pts,lw,closed)=>{path(pts);if(closed)c.closePath();c.strokeStyle=edge;c.lineWidth=lw+2.2;c.stroke();if(closed){c.fillStyle=color;c.fill()}c.strokeStyle=color;c.lineWidth=lw;c.stroke()};
  const items=[];FIG_SEGS.forEach(([a,b,w])=>items.push({dep:(Wp[a].Y+Wp[b].Y)/2,go:()=>limb([P[a],P[b]],Math.max(1.5,w*k*P[a][2]))}));
  items.push({dep:(Wp[1].Y+Wp[2].Y+Wp[7].Y+Wp[8].Y)/4+0.02,go:()=>limb([P[1],P[2],P[8],P[7]],Math.max(2,.1*k*P[1][2]),true)});
  const sm={X:(Wp[1].X+Wp[2].X)/2,Y:(Wp[1].Y+Wp[2].Y)/2,Z:(Wp[1].Z+Wp[2].Z)/2};const hc={X:Wp[0].X,Y:Wp[0].Y+0.07*k,Z:Wp[0].Z+0.02*k};const HP=pr(hc.X,hc.Y,hc.Z),SP=pr(sm.X,sm.Y,sm.Z);const hr=Math.max(3,0.115*k*HP[2]);
  items.push({dep:hc.Y,go:()=>{limb([SP,HP],Math.max(1.5,.09*k*SP[2]));c.beginPath();c.arc(HP[0],HP[1],hr,0,Math.PI*2);c.fillStyle=color;c.fill();c.strokeStyle=edge;c.lineWidth=1.6;c.stroke()}});
  c.save();c.lineCap="round";c.lineJoin="round";items.sort((a,b)=>b.dep-a.dep).forEach(it=>it.go());c.restore();

let spaceBase=null;
function spaceIds(r,sel){return sel.length>1?sel.map(d=>d.id):r.cast.slice()}

function drawGhost(r){const g=$("#lGhost");if(!g||!drag||!drag.preview)return;const D=r.D;let h="";const ids=Object.keys(drag.preview);
  ids.forEach(id=>{const d=dancer(id);if(!d)return;const o=drag.orig[id],q=drag.preview[id];
    h+=`<line class="gh-line" x1="${o.x}" y1="${D-o.y}" x2="${q.x}" y2="${D-q.y}" stroke="${d.color}"/>`});

/* ----- swap two dancers ----- */
function placeSwapUI(r,L){const tools=$("#selTools"),bar=$("#swapBar"),card=$(".stagecard");if(!tools||!bar||!card)return;

  const tg=$("#swapTog");if(tg)tg.setAttribute("aria-pressed",String(ui.swapMode));
  if(ui.swapFrom&&!r.cast.includes(ui.swapFrom))ui.swapFrom=null;
  $$(".tok").forEach(g=>g.classList.toggle("swapsrc",g.dataset.id===ui.swapFrom));$("#stageSvg")?.classList.toggle("swapping",!!((ui.swapMode&&ok)||ui.collect));
  if((ui.swapMode&&ok)||ui.collect){tools.hidden=true;const n=ui.sel.size;
    $("#swapMsg").textContent=ui.collect?`${n} dancer${n===1?"":"s"} collected · tap dancers to add or remove`:ui.swapFrom?`Now tap who swaps with ${dancer(ui.swapFrom)?.name||""}`:"Swap is on · tap two dancers to trade places";
    $("#barBtn").hidden=!ui.collect;$("#barBtn").textContent="Done";bar.hidden=false;return}
  bar.hidden=true;const ids=[...ui.sel].filter(id=>r.cast.includes(id));if(!ok||!ids.length){tools.hidden=true;return}
  const rects=ids.map(id=>$(`.tok[data-id="${id}"] circle.b`)).filter(Boolean).map(c=>c.getBoundingClientRect());if(!rects.length){tools.hidden=true;return}
  const cr=card.getBoundingClientRect(),sv=$("#stageSvg").getBoundingClientRect();const h=rects[0].height;
  const cx=(Math.min(...rects.map(q=>q.left))+Math.max(...rects.map(q=>q.right)))/2-cr.left,bottom=Math.max(...rects.map(q=>q.bottom))-cr.top;
  $("#collectBtn").textContent=ids.length===1?"+ Collect":"+ Add more";$("#clearBtn").hidden=ids.length<2;
  tools.hidden=false;const tw=tools.offsetWidth;

function toggleSwap(){stop();ui.swapMode=!ui.swapMode;ui.swapFrom=null;ui.collect=false;ui.sel.clear();drawFrame();renderInspector()}
function finishCollect(){ui.collect=false;const n=ui.sel.size;drawFrame();renderInspector();
  if(n>1)toast(`${n} dancers selected. Tap a template to arrange just them, or drag one to move the group.`)}
function swapDancers(a,b){const r=R();const f=r.formations[ui.f];const da=dancer(a),db=dancer(b);pushUndo();
  const pa={...posIn(r,f,a)},pb={...posIn(r,f,b)};f.pos[a]=pb;f.pos[b]=pa;
  const sw=o=>{if(!o)return;const x=o[a],y=o[b];if(y!==undefined)o[a]=y;else delete o[a];if(x!==undefined)o[b]=x;else delete o[b]};sw(f.moves);sw(f.motion);
  ui.swapFrom=null;ui.sel.clear();saveRoutine(r);drawFrame();renderInspector();toast(`Swapped ${da?da.name:"dancers"} and ${db?db.name:""} in “${f.name}” · Ctrl+Z to undo`)}

/* ----- stage interaction ----- */
let drag=null;
function svgPt(svg,e){const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const m=svg.getScreenCTM();if(!m)return{x:0,y:0};const p=pt.matrixTransform(m.inverse());return{x:p.x,y:R().D-p.y}}
function bindStage(svg){
  svg.onpointerdown=e=>{if(ui.mode!=="edit"||!canWrite)return;const r=R();stop();const L=locate(r,ui.beat);if(L.moving){seekFormation(L.i);}
    const tok=e.target.closest(".tok");
    if(ui.swapMode){const id=tok&&tok.dataset.id;if(!id||id===ui.swapFrom)ui.swapFrom=null;else if(!ui.swapFrom){ui.swapFrom=id;ui.sel.clear()}else{swapDancers(ui.swapFrom,id);return}drawFrame();renderInspector();return}
    if(ui.collect){if(tok){const id=tok.dataset.id;ui.sel.has(id)?ui.sel.delete(id):ui.sel.add(id);drawFrame();renderInspector()}return}
    const p=svgPt(svg,e);
    if(tok){const id=tok.dataset.id;if(e.shiftKey||e.metaKey||e.ctrlKey){ui.sel.has(id)?ui.sel.delete(id):ui.sel.add(id)}else if(!ui.sel.has(id)){ui.sel.clear();ui.sel.add(id)}
      const f=r.formations[ui.f];const orig={};ui.sel.forEach(i=>orig[i]={...posIn(r,f,i)});drag={kind:"move",start:p,orig,moved:false}}
    else{if(!(e.shiftKey||e.metaKey||e.ctrlKey))ui.sel.clear();drag={kind:"marq",start:p}}
    svg.setPointerCapture(e.pointerId);drawFrame();renderInspector()};
  svg.onpointermove=e=>{if(!drag)return;const r=R();const p=svgPt(svg,e);const f=r.formations[ui.f];
    if(drag.kind==="move"){let dx=p.x-drag.start.x,dy=p.y-drag.start.y;if(!drag.moved&&Math.hypot(dx,dy)<.15)return;drag.moved=true;
      const st=ui.snap?.5:.1;const ids=Object.keys(drag.orig),O=ids.map(id=>drag.orig[id]);const prev={};
      if(ids.length===1){const o=O[0];prev[ids[0]]={x:+clamp(Math.round((o.x+dx)/st)*st,-r.W/2+.5,r.W/2-.5).toFixed(2),y:+clamp(Math.round((o.y+dy)/st)*st,.5,r.D-.5).toFixed(2)}}
      else{dx=Math.round(dx/st)*st;dy=Math.round(dy/st)*st;
        dx=clamp(dx,-r.W/2+.5-Math.min(...O.map(o=>o.x)),r.W/2-.5-Math.max(...O.map(o=>o.x)));dy=clamp(dy,.5-Math.min(...O.map(o=>o.y)),r.D-.5-Math.max(...O.map(o=>o.y)));
        ids.forEach((id,k)=>prev[id]={x:+(O[k].x+dx).toFixed(2),y:+(O[k].y+dy).toFixed(2)})}
      drag.preview=prev;drawGhost(r)}
    else{const m=$("#marq");const x1=Math.min(drag.start.x,p.x),x2=Math.max(drag.start.x,p.x),y1=Math.min(drag.start.y,p.y),y2=Math.max(drag.start.y,p.y);m.hidden=false;
      m.setAttribute("x",x1);m.setAttribute("y",r.D-y2);m.setAttribute("width",x2-x1);m.setAttribute("height",y2-y1);drag.box=[x1,x2,y1,y2]}};
  const end=()=>{if(!drag)return;const r=R();clearGhost();if(drag.kind==="move"&&drag.moved&&drag.preview){const f=r.formations[ui.f];const ch=Object.keys(drag.preview).some(id=>{const a=drag.orig[id],b=drag.preview[id];return a.x!==b.x||a.y!==b.y});if(ch){pushUndo();Object.assign(f.pos,drag.preview);saveRoutine(r);renderTimeline()}}
    if(drag.kind==="marq"&&drag.box){const[x1,x2,y1,y2]=drag.box;const f=r.formations[ui.f];r.cast.forEach(id=>{const p=posIn(r,f,id);if(p.x>=x1&&p.x<=x2&&p.y>=y1&&p.y<=y2)ui.sel.add(id)});$("#marq").hidden=true}
    drag=null;drawFrame();renderInspector()};
  svg.onpointerup=end;svg.onpointercancel=end;
}

let raf=0,clock0=0,beat0=0;

function bindInspector(el,r,f){const sv=()=>{saveRoutine(r);renderTimeline()};let undoArmed=null;const arm=k=>{if(undoArmed!==k){pushUndo();undoArmed=k}};

  $$("[data-col]",el).forEach(b=>b.onclick=()=>{ui.sel=new Set(castOf(r).filter(d=>d.color===b.dataset.col).map(d=>d.id));drawFrame();renderInspector()});

  const ai=$("#iAiGo",el);if(ai)ai.onclick=()=>aiIdea($("#iAi",el).value.trim());

function templateGallery(r,n){n=Math.max(n,1);const{W,D}=r;
  return TEMPLATE_GROUPS.map(([title,items])=>`<div class="tcat"><span>${esc(title.replace("{n}",n))}</span><span class="mono">${items.length}</span></div>
    <div class="tgrid">${items.map(([k,name])=>`<button class="tcard" data-tpl="${k}" data-name="${esc(name)}" title="${esc(name)}"><svg viewBox="${-W/2} 0 ${W} ${D}" aria-hidden="true"><rect x="${-W/2}" y="0" width="${W}" height="${D}" rx="1.2" class="tfl"/>${template(k,n,W,D).map(p=>`<circle cx="${p.x}" cy="${D-p.y}" r="${n>14?.55:.75}" class="tdot"/>`).join("")}</svg><span>${esc(name)}</span></button>`).join("")}</div>`).join("")}
function moveF(d){const r=R();const j=ui.f+d;if(j<0||j>=r.formations.length)return;pushUndo();const a=r.formations;[a[ui.f],a[j]]=[a[j],a[ui.f]];seekFormation(j);saveRoutine(r);renderTimeline();drawFrame();renderInspector()}
function align(kind){const r=R();const f=r.formations[ui.f];const ids=[...ui.sel];if(!ids.length)return;pushUndo();const P=ids.map(id=>({id,...posIn(r,f,id)}));
  const avg=k=>P.reduce((s,p)=>s+p[k],0)/P.length;
  if(kind==="row"){const y=+avg("y").toFixed(1);P.sort((a,b)=>a.x-b.x);const sp=P.length>1?Math.max(2,(Math.max(...P.map(p=>p.x))-Math.min(...P.map(p=>p.x)))/(P.length-1)):0;const cx=avg("x");P.forEach((p,k)=>f.pos[p.id]={x:+clamp(cx+(k-(P.length-1)/2)*sp,-r.W/2+.5,r.W/2-.5).toFixed(1),y})}
  if(kind==="col"){const x=+avg("x").toFixed(1);P.sort((a,b)=>a.y-b.y);const cy=avg("y");P.forEach((p,k)=>f.pos[p.id]={x,y:+clamp(cy+(k-(P.length-1)/2)*2.5,.5,r.D-.5).toFixed(1)})}
  if(kind==="spread"){const horiz=(Math.max(...P.map(p=>p.x))-Math.min(...P.map(p=>p.x)))>=(Math.max(...P.map(p=>p.y))-Math.min(...P.map(p=>p.y)));const k1=horiz?"x":"y";P.sort((a,b)=>a[k1]-b[k1]);const lo=P[0][k1],hi=P[P.length-1][k1];P.forEach((p,k)=>{const v=P.length>1?lo+(hi-lo)*k/(P.length-1):lo;f.pos[p.id]={...posIn(r,f,p.id),[k1]:+v.toFixed(1)}})}
  if(kind==="mirror"){P.forEach(p=>f.pos[p.id]={x:+(-p.x).toFixed(1),y:p.y})}
  if(kind==="center"){const dx=avg("x");P.forEach(p=>f.pos[p.id]={x:+(p.x-dx).toFixed(1),y:p.y})}
  saveRoutine(r);drawFrame()}

async function aiIdea(desc){const r=R();const msg=$("#iAiMsg");if(!sampler)return;const f=r.formations[ui.f];const cast=castOf(r);if(!cast.length)return;
  msg.textContent="Thinking…";const btn=$("#iAiGo");btn.disabled=true;
  const roster=cast.map(d=>({name:d.name,height_in:d.height||66,role:d.role||"Dancer"}));
  const prompt=`You design stage formations for a college Bollywood dance team. Stage is ${r.W} ft wide and ${r.D} ft deep. Coordinates: x from ${-r.W/2+1} (stage right, audience's left) to ${r.W/2-1} (stage left), 0 is center; y from 1 (front, nearest audience) to ${r.D-1} (back). Keep dancers at least 2 ft apart and visible to the audience (use windows). Dancers: ${JSON.stringify(roster)}. Previous formation positions: ${JSON.stringify(cast.map(d=>({name:d.name,...posIn(r,f,d.id)})))}.
Request: ${desc||"a fresh, visually interesting formation that flows from the previous one"}.
Reply with JSON only: {"name": short formation name, "positions":[{"name": dancer name exactly as given, "x": number, "y": number}], "tip": one short sentence for the choreographer}.`;
  try{const out=await sampler.json(prompt,{modelTier:"default"});const pos={};(out.positions||[]).forEach(p=>{const d=cast.find(c=>c.name===p.name);if(d&&isFinite(p.x)&&isFinite(p.y))pos[d.id]={x:+clamp(+p.x,-r.W/2+.5,r.W/2-.5).toFixed(1),y:+clamp(+p.y,.5,r.D-.5).toFixed(1)}});
    if(!Object.keys(pos).length)throw{code:"empty"};pushUndo();Object.assign(f.pos,pos);if(out.name&&/^Formation \d+$/.test(f.name))f.name=String(out.name).slice(0,40);saveRoutine(r);drawFrame();renderTimeline();renderInspector();
    const m2=$("#iAiMsg");if(m2)m2.textContent=out.tip?String(out.tip).slice(0,160):"Applied. Ctrl+Z to undo."}
  catch(e){const c=e&&e.code;msg.textContent=c==="not_granted"?"Formation ideas are turned off for this page.":c==="rate_limited"?"Too many requests. Try again in a minute.":"Couldn't get an idea this time. Try rephrasing.";if(c==="not_granted"){sampler=null;$("#aiSec").hidden=true}}
  finally{const b=$("#iAiGo");if(b)b.disabled=false}}

    ${r?`<span class="hint">${r.formations.length} formations · ${r.bpm} BPM${r.songName?" · ♪ "+esc(r.songName):""}</span>${r.songName?`<button class="btn sm" data-song style="align-self:start">${hasSong()?"Change song file":"Load song file"}</button>`:""}`:""}</div>
  ${ui.spot?`<div class="p-card"><span class="lbl">My costumes & props</span>${mine.length?mine.map(i=>`<div class="row" style="justify-content:space-between"><span>${esc(i.name)}</span><span class="status st-${i.status}">${STATUSES.find(x=>x[0]===i.status)[1]}</span></div>`).join(""):`<span class="hint">Nothing assigned to you yet.</span>`}</div>`:""}
  <div class="p-card"><span class="lbl">Got a routine file?</span><button class="btn sm" id="pImport" style="align-self:start">Open a routine file</button></div>
  <div class="p-card"><span class="lbl">Team</span><b>${esc(team.name||"Your team")}</b><span class="hint">${team.roster.length} dancers</span></div>`}
function routeFromHash(){const h=location.hash.slice(1);ui.phone=h==="phone"||(h!=="editor"&&window.innerWidth<600)}
window.addEventListener("hashchange",()=>{if(location.hash.startsWith("#r=")){importFromHash();return}stop();routeFromHash();if(!ui.phone){ui.mode=canWrite?"edit":"spot"}render();window.scrollTo(0,0)});
routeFromHash();


/* ---------------- sharing: links, files, published team file ---------------- */
const REPO="samarth2006manjunath-rgb/8count";
const b64u={enc:u8=>{let s="";for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")},
  dec:str=>{str=str.replace(/-/g,"+").replace(/_/g,"/");while(str.length%4)str+="=";const b=atob(str);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}};
async function pack(obj){const data=new TextEncoder().encode(JSON.stringify(obj));if(!window.CompressionStream)return "j"+b64u.enc(data);
  const cs=new Blob([data]).stream().pipeThrough(new CompressionStream("deflate-raw"));return "z"+b64u.enc(new Uint8Array(await new Response(cs).arrayBuffer()))}
async function unpack(str){const kind=str[0],u=b64u.dec(str.slice(1));let txt;
  if(kind==="z"){const ds=new Blob([u]).stream().pipeThrough(new DecompressionStream("deflate-raw"));txt=await new Response(ds).text()}else txt=new TextDecoder().decode(u);return JSON.parse(txt)}
function bundleRoutine(r){const ids=new Set(r.cast),mids=new Set();r.formations.forEach(f=>{if(f.motion)Object.values(f.motion).forEach(id=>mids.add(id))});
  return{app:"8count",kind:"routine",v:1,exportedAt:Date.now(),teamName:team.name,routine:clone(r),dancers:team.roster.filter(d=>ids.has(d.id)).map(clone),motions:[...mids].map(id=>motions[id]).filter(Boolean).map(clone)}}
function bundleTeam(){return{app:"8count",kind:"team",v:1,exportedAt:Date.now(),team:clone(team),routines:clone(routines),motions:clone(motions)}}
function importBundle(b){if(!b||b.app!=="8count"||!b.kind)throw new Error("not an 8Count file");
  const take=(r)=>{const cur=routines[r.id];if(!cur||(r.updatedAt||0)>=(cur.updatedAt||0))routines[r.id]=r};
  if(b.kind==="routine"){(b.dancers||[]).forEach(d=>{const i=team.roster.findIndex(x=>x.id===d.id);if(i<0)team.roster.push(d);else if(team.roster[i].sample)team.roster[i]=d});
    (b.motions||[]).forEach(mo=>{if(mo&&mo.id)motions[mo.id]=mo});if(!team.name&&b.teamName)team.name=b.teamName;take(b.routine);persistLocal();return{ids:[b.routine.id],title:b.routine.title}}
  if(b.kind==="team"){const t=b.team||{};const newer=(t.updatedAt||b.exportedAt||0)>=(team.updatedAt||0);
    const byId=new Map(team.roster.map(d=>[d.id,d]));(t.roster||[]).forEach(d=>{if(newer||!byId.has(d.id))byId.set(d.id,d)});
    team={name:newer?(t.name||team.name):team.name,roster:[...byId.values()],sessions:newer?(t.sessions||[]):team.sessions,items:newer?(t.items||[]):team.items,updatedAt:Math.max(team.updatedAt||0,t.updatedAt||0)};
    Object.values(b.routines||{}).forEach(take);Object.values(b.motions||{}).forEach(mo=>{if(mo&&mo.id)motions[mo.id]=mo});persistLocal();
    const ids=Object.keys(b.routines||{});return{ids,title:ids.length+" routine"+(ids.length===1?"":"s")}}
  throw new Error("unknown file")}
function downloadJSON(obj,name){const blob=new Blob([JSON.stringify(obj)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
const fileSlug=s=>String(s||"routine").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40)||"routine";
const importIn=document.createElement("input");importIn.type="file";importIn.accept=".json,application/json";importIn.hidden=true;document.body.appendChild(importIn);
function pickImport(){importIn.value="";importIn.click()}
importIn.addEventListener("change",async()=>{const file=importIn.files[0];if(!file)return;try{const res=importBundle(JSON.parse(await file.text()));stop();if(res.ids[0]&&routines[res.ids[0]])ui.rid=res.ids[0];ui.f=0;ui.beat=0;if(!ui.phone)ui.tab="stage";render();toast(`Opened ${res.title}`)}
  catch(e){toast("That file isn't an 8Count routine or team file.")}});
async function importFromHash(){const h=location.hash.slice(1);if(!h.startsWith("r="))return false;
  try{const res=importBundle(await unpack(h.slice(2)));ui.rid=res.ids[0];ui.f=0;ui.beat=0;ui.tab="stage";history.replaceState(null,"",location.pathname+location.search);routeFromHash();render();toast(`Loaded “${res.title}”`)}
  catch(e){history.replaceState(null,"",location.pathname+location.search);toast("This share link is broken or cut off. Ask for a new one, or for the file.")}return true}
async function shareRoutine(){const r=R();if(!r)return;stop();const bundle=bundleRoutine(r);const code=await pack(bundle);const url=location.origin+location.pathname+"#r="+code;
  const nClips=bundle.motions.length,tooLong=url.length>60000,long=url.length>6000;
  const m=document.createElement("div");m.className="modal";
  m.innerHTML=`<div class="box" role="dialog" aria-modal="true" aria-labelledby="shT"><b id="shT" style="font-size:16px">Share “${esc(r.title)}”</b>
    ${tooLong?`<p class="hint" style="font-size:13px;margin:0">This routine is too big for a link because of its motion clips. Send the file instead: anyone can open it with <b>Open file</b> on the 8Count site.</p>`
    :`<p class="hint" style="font-size:13px;margin:0">Anyone who opens this link gets the routine, its ${bundle.dancers.length} dancers${nClips?` and ${nClips} motion clip${nClips>1?"s":""}`:""}. It's a snapshot, so send a new link after you make changes.</p>
      <textarea id="shUrl" rows="3" readonly style="font-family:var(--f-mono);font-size:11px">${esc(url)}</textarea>
      ${long?`<p class="hint" style="margin:0">This link is long${nClips?" because of the motion clips":""}. If your chat app cuts it off, send the file instead.</p>`:""}`}
    <div class="row" style="justify-content:flex-end"><button class="btn" data-x>Close</button><button class="btn" id="shFile">Download file</button>${tooLong?"":`${navigator.share?`<button class="btn" id="shNative">Share…</button>`:""}<button class="btn pri" id="shCopy">Copy link</button>`}</div></div>`;
  document.body.appendChild(m);m.addEventListener("click",e=>{if(e.target===m||e.target.closest("[data-x]"))m.remove()});
  $("#shFile",m).onclick=()=>{downloadJSON(bundle,fileSlug(r.title)+".8count.json");toast("File saved. Send it to your team.")};
  const cp=$("#shCopy",m);if(cp)cp.onclick=async()=>{try{await navigator.clipboard.writeText(url);toast("Link copied")}catch(e){const t=$("#shUrl",m);t.focus();t.select();toast("Press Ctrl+C (or ⌘C) to copy")}};
  const nv=$("#shNative",m);if(nv)nv.onclick=()=>navigator.share({title:r.title+" · 8Count",url}).catch(()=>{});}
async function loadPublished(){try{const res=await fetch("team.json",{cache:"no-store"});if(!res.ok)return;const b=await res.json();if(!b||b.kind!=="team")return;
  const seen=ls.get("8c.pub")||0;if((b.exportedAt||0)<=seen)return;const first=!Object.keys(routines).length;importBundle(b);ls.set("8c.pub",b.exportedAt||Date.now());
  if(!routines[ui.rid])ui.rid=null;stop();render();toast(first?`Loaded ${team.name||"your team"}'s routines`:"Got the latest team routines")}catch(e){}}

/* ---------------- keyboard ---------------- */
document.addEventListener("keydown",e=>{if(ui.tab!=="stage"||!R())return;const typing=e.target.matches("input,textarea,select");
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"&&!typing&&canWrite){e.preventDefault();undo();return}
  if(typing)return;
  if(e.key===" "){e.preventDefault();toggle()}
  else if((e.key==="s"||e.key==="S")&&!e.metaKey&&!e.ctrlKey&&ui.mode==="edit"&&ui.view==="top"&&canWrite){toggleSwap()}
  else if(e.key==="["){step(-1)}else if(e.key==="]"){step(1)}
  else if(e.key.startsWith("Arrow")&&ui.sel.size&&ui.mode==="edit"&&canWrite){e.preventDefault();const r=R();const f=r.formations[ui.f];const d=.5;pushUndo();
    ui.sel.forEach(id=>{const p={...posIn(r,f,id)};if(e.key==="ArrowLeft")p.x-=d;if(e.key==="ArrowRight")p.x+=d;if(e.key==="ArrowUp")p.y+=d;if(e.key==="ArrowDown")p.y-=d;f.pos[id]={x:+clamp(p.x,-r.W/2+.5,r.W/2-.5).toFixed(2),y:+clamp(p.y,.5,r.D-.5).toFixed(2)}});saveRoutine(r);drawFrame()}
  else if(e.key==="Escape"){if(drag&&drag.kind==="move"){drag=null;clearGhost();drawFrame();return}if(ui.swapMode){if(ui.swapFrom)ui.swapFrom=null;else toggleSwap();drawFrame();return}if(ui.collect){finishCollect();return}ui.swapFrom=null;ui.sel.clear();drawFrame();renderInspector()}});
window.addEventListener("resize",()=>{if(ui.tab==="stage"&&R()&&!ui.phone)drawFrame()});
const mq=window.matchMedia?.("(prefers-color-scheme: dark)");mq?.addEventListener?.("change",()=>{if(ui.view==="3d")drawFrame()});

/* ---------------- boot ---------------- */
render();
importFromHash().then(()=>loadPublished());
(async()=>{
  const c=window.claude;
  if(!c||typeof c.use!=="function"){backend="local";setStatus("ok","Saved in this browser");render();return}
  const [dbNs,userNs,smp]=await Promise.all([c.use("db").catch(()=>null),c.use("user").catch(()=>null),c.use("sample").catch(()=>null)]);
  sampler=smp||null;
  if(userNs){try{const w=await userNs.can("data.write");if(w===false){canWrite=false;applyRO()}}catch(e){}}
  if(!dbNs){backend="local";setStatus("ok","Saved in this browser");render();return}
  db=dbNs;backend="cloud";setStatus("busy","Connecting…");
  let teamOk=false,rOk=false;const loadTimer=setTimeout(()=>{if(!teamOk||!rOk)setStatus("warn","Offline – showing last saved")},10000);
  const done=()=>{if(teamOk&&rOk){clearTimeout(loadTimer);setStatus("ok",canWrite?"Synced with team":"View only")}};
  const rerender=()=>{if(drag||ui.playing)return;const a=document.activeElement;if(a&&a.matches("input,textarea")&&$("#main").contains(a)&&ui.tab!=="stage")return;
    if(ui.phone){render();return}
    if(ui.tab==="stage"&&$("#stageSvg")&&R()){buildStage();renderTimeline();renderTransport();renderInspector();drawFrame();$("#teamLabel").textContent=team.name||""}else render()};
  db.doc("team/main").onSnapshot(s=>{if(!s.metadata.fromCache){teamOk=true;done()}if(dirty.team)return;
      if(s.exists){team=Object.assign({name:"",roster:[],sessions:[],items:[]},clone(s.data()))}
      else if(!s.metadata.fromCache&&cache&&cache.team&&canWrite&&(cache.team.roster.length||cache.team.name)){saveTeam()} // first sync: upload local team
      persistLocal();rerender()},
    e=>{clearTimeout(loadTimer);setStatus("warn","Not synced");});
  db.collection("motions").onSnapshot(q=>{if(q.metadata.fromCache&&!q.size)return;const next={};q.docs.forEach(d=>next[d.id]=clone(d.data()));
      if(!q.metadata.fromCache&&q.empty&&Object.keys(motions).length&&canWrite){Object.values(motions).forEach(saveMotion);return}
      motions=next;persistLocal();rerender()},e=>{});
  db.collection("routines").onSnapshot(q=>{if(!q.metadata.fromCache){rOk=true;done()}
      const next={};q.docs.forEach(d=>{const id=d.id;if(dirty["r:"+id]){if(routines[id])next[id]=routines[id];return}next[id]=clone(d.data())});
      Object.keys(routines).forEach(id=>{if(dirty["r:"+id]&&routines[id])next[id]=routines[id]});
      if(!q.metadata.fromCache&&q.empty&&Object.keys(routines).length&&canWrite){Object.values(routines).forEach(r=>queue("r:"+r.id));return}
      routines=next;persistLocal();if(ui.rid&&!routines[ui.rid])ui.rid=null;rerender()},
    e=>{clearTimeout(loadTimer);setStatus("warn","Not synced")});
})();
})();
